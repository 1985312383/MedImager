[project]
name = "medimager"
version = "2.4.0"
description = "A modern, cross-platform open-source DICOM viewer and medical image analysis tool"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "1985312383 / MedImager contributors" }
]
dependencies = [
    "numpy>=2.3.1",
    "pillow>=10.0.0",
    "pydicom>=3.0.1",
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.2",
    "pylibjpeg-openjpeg>=2.4",
    "pyjpegls>=1.5",
    "SimpleITK>=2.4.0",
    "pyside6>=6.9.1",
    "toml>=0.10.2"
]

[project.urls]
Homepage = "https://github.com/1985312383/MedImager"
Repository = "https://github.com/1985312383/MedImager"
Issues = "https://github.com/1985312383/MedImager/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
medimager = [
    "icons/*.svg",
    "icons/logo.png",
    "themes/ui/*.toml",
    "themes/roi/*.toml",
    "themes/measurement/*.toml",
    "i18n/compiled/*.json",
    "i18n/manifest.yml",
]

[tool.setuptools.packages.find]
include = ["medimager*"]
exclude = ["medimager.tests*"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "auto-py-to-exe>=2.0.0",
    "pytest>=7.0.0",
    "pytest-qt>=4.0.0"
]

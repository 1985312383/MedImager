name: Release MedImager

"on":
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --dev

      - name: Resolve release version
        id: release_info
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.version || github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Sync version, update changelog, and generate release notes
        shell: pwsh
        run: |
          $tag = "${{ steps.release_info.outputs.tag }}"
          $version = "${{ steps.release_info.outputs.version }}"
          $prerelease = "${{ github.event.inputs.prerelease || true }}"

          (Get-Content "pyproject.toml") -replace 'version = "[^"]+"', "version = `"$version`"" | Set-Content "pyproject.toml"

          $allTags = git tag --sort=-creatordate
          $previousTag = $allTags | Where-Object { $_ -ne $tag } | Select-Object -First 1
          if ($previousTag) {
            $commitRange = "${previousTag}..HEAD"
            $commitHeader = "从 $previousTag 到 $tag"
          } else {
            $commitRange = "HEAD"
            $commitHeader = "当前历史记录"
          }

          $commitLines = @(git log $commitRange --pretty=format:"- %h %s (%an)")
          if ($commitLines.Count -gt 0) {
            $commits = $commitLines -join "`n"
          } else {
            $commits = "- No commits found."
          }

          $releaseType = if ($prerelease -eq "true") { "Preview Release" } else { "Stable Release" }
          $releaseDate = Get-Date -Format "yyyy-MM-dd"
          $features = @(
            "- 2.0 合并 1.0 与 1.x 成果，形成稳定的 2D DICOM 基线版本",
            "- 支持 DICOM 文件/文件夹加载、普通图片加载、多序列管理、多视图显示和基础测量",
            "- 支持 ROI 统计、窗宽窗位、当前视图截图导出、当前切片图像导出和标注持久化",
            "- 内置专业合成 DICOM 测试覆盖与大序列加载/显示性能基准",
            "- Release 构建会在关于对话框中显示版本、项目地址和最近一次 release changelog"
          ) -join "`n"

          $usage = @(
            "1. 下载并解压 ZIP 文件",
            "2. 运行 ``MedImager.exe``",
            "3. 通过菜单打开 DICOM 文件、DICOM 文件夹或普通图片",
            "4. 使用窗宽窗位、ROI、测量和导出工具完成基础查看与分析"
          ) -join "`n"

          $notes = @(
            "## MedImager v$version - $releaseType",
            "",
            "### 特性",
            $features,
            "",
            "### 使用方法",
            $usage,
            "",
            "### 本次 Release Commit 记录",
            $commitHeader,
            "",
            $commits
          ) -join "`n"

          $notes | Out-File -FilePath "release_notes.md" -Encoding UTF8

          $changelogEntry = @(
            "## $version - $releaseDate",
            "",
            "### 特性",
            $features,
            "",
            "### 使用方法",
            $usage,
            "",
            "### 本次 Release Commit 记录",
            $commitHeader,
            "",
            $commits
          ) -join "`n"

          $changelogEntry | Out-File -FilePath "release_entry.md" -Encoding UTF8

          $env:MEDIMAGER_CHANGELOG_VERSION = $version
          @'
          import os
          from pathlib import Path

          version = os.environ["MEDIMAGER_CHANGELOG_VERSION"]
          changelog_path = Path("CHANGELOG.md")
          entry = Path("release_entry.md").read_text(encoding="utf-8").strip()
          existing = changelog_path.read_text(encoding="utf-8") if changelog_path.exists() else "# Changelog\n"

          if f"## {version} " not in existing:
              if existing.startswith("# Changelog"):
                  lines = existing.splitlines()
                  title = lines[0]
                  rest = "\n".join(lines[1:]).strip()
                  updated = f"{title}\n\n{entry}\n"
                  if rest:
                      updated += f"\n{rest}\n"
              else:
                  updated = f"# Changelog\n\n{entry}\n\n{existing.strip()}\n"
              changelog_path.write_text(updated, encoding="utf-8")
          '@ | uv run python -

          $env:MEDIMAGER_VERSION = $version
          $env:MEDIMAGER_CHANGELOG = $notes
          @'
          import os
          from pathlib import Path

          Path("medimager/_build_info.py").write_text(
              '"""Build-time metadata generated by .github/workflows/release.yml."""\n\n'
              f"VERSION = {os.environ['MEDIMAGER_VERSION']!r}\n"
              f"RELEASE_CHANGELOG = {os.environ['MEDIMAGER_CHANGELOG']!r}\n",
              encoding="utf-8",
          )
          '@ | uv run python -

      - name: Persist changelog to default branch
        shell: pwsh
        continue-on-error: true
        run: |
          $version = "${{ steps.release_info.outputs.version }}"
          $defaultBranch = "${{ github.event.repository.default_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin $defaultBranch
          git worktree add changelog-worktree "origin/$defaultBranch"
          Copy-Item "release_entry.md" "changelog-worktree/release_entry.md" -Force

          Push-Location changelog-worktree
          $env:MEDIMAGER_CHANGELOG_VERSION = $version
          @'
          import os
          from pathlib import Path

          version = os.environ["MEDIMAGER_CHANGELOG_VERSION"]
          changelog_path = Path("CHANGELOG.md")
          entry = Path("release_entry.md").read_text(encoding="utf-8").strip()
          existing = changelog_path.read_text(encoding="utf-8") if changelog_path.exists() else "# Changelog\n"

          if f"## {version} " not in existing:
              if existing.startswith("# Changelog"):
                  lines = existing.splitlines()
                  title = lines[0]
                  rest = "\n".join(lines[1:]).strip()
                  updated = f"{title}\n\n{entry}\n"
                  if rest:
                      updated += f"\n{rest}\n"
              else:
                  updated = f"# Changelog\n\n{entry}\n\n{existing.strip()}\n"
              changelog_path.write_text(updated, encoding="utf-8")
          '@ | python -

          Remove-Item -LiteralPath "release_entry.md" -Force
          git add CHANGELOG.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: update changelog for v$version"
            git push origin "HEAD:$defaultBranch"
          } else {
            Write-Output "CHANGELOG.md already contains v$version; no commit needed."
          }
          Pop-Location

      - name: Build application
        run: uv run pyinstaller MedImager.spec --clean --noconfirm

      - name: Create release package
        shell: pwsh
        run: |
          $version = "${{ steps.release_info.outputs.version }}"
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $prerelease = "${{ github.event.inputs.prerelease || true }}"

          if ($prerelease -eq "true") {
            $releaseDir = "MedImager_v${version}_preview_${timestamp}"
            $zipName = "MedImager_v${version}_preview_${timestamp}.zip"
          } else {
            $releaseDir = "MedImager_v${version}"
            $zipName = "MedImager_v${version}.zip"
          }

          New-Item -ItemType Directory -Path $releaseDir
          Copy-Item "dist/MedImager.exe" "$releaseDir/"
          Copy-Item "README.md" "$releaseDir/" -ErrorAction SilentlyContinue
          Copy-Item "README_zh.md" "$releaseDir/" -ErrorAction SilentlyContinue
          Copy-Item "CHANGELOG.md" "$releaseDir/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "$releaseDir/" -ErrorAction SilentlyContinue
          Copy-Item "release_notes.md" "$releaseDir/RELEASE_NOTES.md"

          @"
          MedImager v$version

          构建时间: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
          构建环境: GitHub Actions

          详细 release notes 请查看 RELEASE_NOTES.md。
          "@ | Out-File -FilePath "$releaseDir/VERSION.txt" -Encoding UTF8

          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zipName

          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedImager-Windows
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: MedImager v${{ steps.release_info.outputs.version }}
          body_path: release_notes.md
          files: ${{ env.ZIP_NAME }}
          prerelease: ${{ github.event.inputs.prerelease || true }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
